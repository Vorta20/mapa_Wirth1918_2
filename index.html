        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        function bearingBetween(lat1, lon1, lat2, lon2) {
            var toRad = function (d) { return d * Math.PI / 180; };
            var toDeg = function (r) { return r * 180 / Math.PI; };
            var dLon = toRad(lon2 - lon1);
            var y = Math.sin(dLon) * Math.cos(toRad(lat2));
            var x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            return (toDeg(Math.atan2(y, x)) + 360) % 360;
        }
        function haversineKm(a, b) {
            var R = 6371;
            var toRad = function (d) { return d * Math.PI / 180; };
            var dLat = toRad(b[1] - a[1]);
            var dLon = toRad(b[0] - a[0]);
            var lat1 = toRad(a[1]), lat2 = toRad(b[1]);
            var h = Math.pow(Math.sin(dLat / 2), 2) +
                    Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin(dLon / 2), 2);
            return 2 * R * Math.asin(Math.sqrt(h));
        }
        function midpointWithBearing(coords) {
            if (!coords || coords.length < 2) return null;
            var dist = [0];
            for (var i = 1; i < coords.length; i++) {
                dist.push(dist[i - 1] + haversineKm(coords[i - 1], coords[i]));
            }
            var half = dist[dist.length - 1] / 2;
            var idx = 1;
            while (idx < dist.length && dist[idx] < half) idx++;
            var p1 = coords[idx - 1], p2 = coords[idx];
            var segLen = dist[idx] - dist[idx - 1];
            var t = segLen > 0 ? (half - dist[idx - 1]) / segLen : 0;
            var lat = p1[1] + (p2[1] - p1[1]) * t;
            var lon = p1[0] + (p2[0] - p1[0]) * t;
            return {
                latlng: L.latLng(lat, lon),
                bearing: bearingBetween(p1[1], p1[0], p2[1], p2[0])
            };
        }

            div_Jmna.className= "filter-section";
            document.getElementById("menu").appendChild(div_Jmna);
            var lab_Jmna = document.createElement('div');
            lab_Jmna.innerHTML = 'Jména';
            lab_Jmna.className = 'card-label';
            div_Jmna.appendChild(lab_Jmna);
            // skrytý výběr, ze kterého čte filterFunc(); ovládá se zaškrtávacími políčky
            sel_Jmna = document.createElement('select');
            sel_Jmna.multiple = true;
            sel_Jmna.hidden = true;
            sel_Jmna.id = "sel_Jmna";
            var Jmna_options_str = "<option value='' unselected></option>";
            Jmna_options_str  += '<option value="Antonín Matějček">Antonín Matějček</option>';
            Jmna_options_str  += '<option value="Pavel Janák">Pavel Janák</option>';
            Jmna_options_str  += '<option value="Vincenc Kramář">Vincenc Kramář</option>';
            Jmna_options_str  += '<option value="Zdeněk Wirth">Zdeněk Wirth</option>';
            sel_Jmna.innerHTML = Jmna_options_str;
            div_Jmna.appendChild(sel_Jmna);
            var checks_Jmna = [];
            function syncJmnaSelection() {
                var checked = checks_Jmna.filter(function (cb) { return cb.checked; })
                                         .map(function (cb) { return cb.value; });
                var allChecked = checked.length === checks_Jmna.length;
                var options = sel_Jmna.options;
                for (var i = 0; i < options.length; i++) {
                    var v = options[i].value;
                    // vše zaškrtnuto = bez filtru; nic nezaškrtnuto = vybrat jen prázdnou volbu, což skryje vše
                    options[i].selected = allChecked ? false
                        : (v === '' ? checked.length === 0 : checked.indexOf(v) >= 0);
                }
                filterFunc();
            }
            persons_Pohybosob_4.forEach(function (p) {
                var label = document.createElement('label');
                label.className = 'check-option';
                var cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'ui-check';
                cb.value = p.name;
                cb.checked = true;
                cb.addEventListener('change', syncJmnaSelection);
                label.appendChild(cb);
                label.appendChild(document.createTextNode(p.name));
                div_Jmna.appendChild(label);
                checks_Jmna.push(cb);
            });
            var reset_filters = document.createElement('button');
            reset_filters.type = 'button';
            reset_filters.className = 'filter-reset';
            reset_filters.textContent = 'Vymazat filtr';
            reset_filters.onclick = function() {
                checks_Jmna.forEach(function (cb) { cb.checked = true; });
                syncJmnaSelection();
                sel_Rok.noUiSlider.reset();
            };
            document.getElementById("menu").appendChild(reset_filters);
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        resetLabels([layer_Hranice_3,layer_Navtvenmsta_5]);
        map.on("zoomend", function(){
            resetLabels([layer_Hranice_3,layer_Navtvenmsta_5]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_Hranice_3,layer_Navtvenmsta_5]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_Hranice_3,layer_Navtvenmsta_5]);
        });
        </script>
