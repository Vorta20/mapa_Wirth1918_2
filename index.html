        // --- Vlastní úprava: pevný počáteční pohled na mapu ---
        // Původní map.fitBounds(...) si samo dopočítávalo zoom podle aktuální
        // pixelové velikosti #map divu - na notebooku a na velkém externím
        // monitoru proto vycházel jiný zoom a tedy i jiný (dole navíc natvrdo
        // zamčený) výřez mapy. Střed a zoom jsou teď pevně dané (setView), takže
        // měřítko i výřez jsou na všech zařízeních stejné.
        var map = L.map('map', {
            zoomControl: false,
            maxZoom: 11,
            minZoom: 6,
            maxBounds: L.latLngBounds(
                [41.927088784312986, 4.08157305298569],
                [54.69405779497386, 33.1164705086548]
            )
        }).setView([48.713509044983, 18.599021780820255], 6);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        // --- Vlastní úprava: sjednocení názvů atributů mezi vrstvou bodů a vrstvou tras,
        //     aby filtr Rok / Jména fungoval na obou vrstvách stejně (qgis2web export
        //     má u bodů atributy 'ROK' a 'Jméno' ve zkráceném tvaru, např. "Zd. Wirth",
        //     u linek atributy 'Rok' a 'Jména ' v plném tvaru, např. "Zdeněk Wirth").
        //     Mapování zkratka -> plné jméno se dopočítá dynamicky z vrstvy tras podle
        //     příjmení, takže funguje i po případné další změně jmen v QGISu. ---
        (function normalizeAttributesForFilter() {
            if (typeof json_Navtvenmsta_5 === 'undefined' || typeof json_Pohybosob_4 === 'undefined') return;
            var surnameToFullName = {};
            json_Pohybosob_4.features.forEach(function (f) {
                var full = f.properties['Jména '];
                if (!full) return;
                var parts = String(full).trim().split(' ');
                surnameToFullName[parts[parts.length - 1]] = full;
            });
            json_Navtvenmsta_5.features.forEach(function (f) {
                var p = f.properties;
                if (p['ROK'] !== undefined && p['Rok'] === undefined) {
                    p['Rok'] = p['ROK'];
                }
                if (p['Jméno'] !== undefined && p['Jména '] === undefined) {
                    var parts = String(p['Jméno']).trim().split(' ');
                    var surname = parts[parts.length - 1];
                    p['Jména '] = surnameToFullName[surname] || p['Jméno'];
                }
            });
        })();

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

            var content = removeEmptyRowsFromPopupContent(popupContent, feature);

        function pop_Navtvenmsta_5(feature, layer) {

        // --- Vlastní úprava: velikost a barva bodu podle toho, jestli jde o
        //     počáteční, koncový nebo průběžný bod cesty dané osoby. Dřívější

        //     které čísluje zastávky KAŽDÉ OSOBY zvlášť od 1 do N v pořadí

        //     dopředu z celé (nefiltrované) vrstvy bodů.
        var poradiRangeByJmeno_Navtvenmsta_5 = {};
        (function () {
            if (typeof json_Navtvenmsta_5 === 'undefined') return;
            json_Navtvenmsta_5.features.forEach(function (f) {
                var jmeno = f.properties['Jméno'];
                var poradi = parseInt(f.properties['PORADI'], 10);
                if (jmeno == null || isNaN(poradi)) return;
                var range = poradiRangeByJmeno_Navtvenmsta_5[jmeno];
                if (!range) {
                    poradiRangeByJmeno_Navtvenmsta_5[jmeno] = { min: poradi, max: poradi };
                } else {
                    if (poradi < range.min) range.min = poradi;
                    if (poradi > range.max) range.max = poradi;
                }
            });
        })();
        function style_Navtvenmsta_5_0(feature) {
            var jmeno = feature ? feature.properties['Jméno'] : null;
            var poradi = feature ? parseInt(feature.properties['PORADI'], 10) : NaN;
            var range = jmeno != null ? poradiRangeByJmeno_Navtvenmsta_5[jmeno] : null;

            var fillColor = 'rgba(43,225,52,1.0)';

                    radius = 14.0;
                    fillColor = 'rgba(39,174,96,1.0)';
                } else if (poradi === range.max) {
                    radius = 14.0;
                    fillColor = 'rgba(192,57,43,1.0)';
                }

                pane: 'pane_Navtvenmsta_5',

        // --- Vlastní úprava: šipky se směrem pohybu na trasách (Pohybosob_4) ---
        // Barvy odpovídají barvám linek v style_Pohybosob_4_0.
        var personColors_Pohybosob_4 = {
            'Janak': 'rgba(192,57,43,1.0)',
            'Kramar': 'rgba(211,84,0,1.0)',
            'Matejcka': 'rgba(27,79,114,1.0)',
            'Wirth': 'rgba(118,68,138,1.0)'
        };
        function bearingBetween(lat1, lon1, lat2, lon2) {
            var toRad = function (d) { return d * Math.PI / 180; };
            var toDeg = function (r) { return r * 180 / Math.PI; };
            var dLon = toRad(lon2 - lon1);
            var y = Math.sin(dLon) * Math.cos(toRad(lat2));
            var x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            return (toDeg(Math.atan2(y, x)) + 360) % 360;
        }
        function haversineKm(a, b) {
            var R = 6371;
            var toRad = function (d) { return d * Math.PI / 180; };
            var dLat = toRad(b[1] - a[1]);
            var dLon = toRad(b[0] - a[0]);
            var lat1 = toRad(a[1]), lat2 = toRad(b[1]);
            var h = Math.pow(Math.sin(dLat / 2), 2) +
                    Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin(dLon / 2), 2);
            return 2 * R * Math.asin(Math.sqrt(h));
        }

        var Filters = {"Rok": "int","Jména ": "str"};
        function filterFunc() {
          map.eachLayer(function(lyr){
          if ("options" in lyr && "dataVar" in lyr["options"]){
            features = this[lyr["options"]["dataVar"]].features.slice(0);
            try{
              for (key in Filters){
                keyS = key.replace(/[^a-zA-Z0-9_]/g, "")
                if (Filters[key] == "str" || Filters[key] == "bool"){
                  var selection = [];
                  var options = document.getElementById("sel_" + keyS).options
                  for (var i=0; i < options.length; i++) {
                    if (options[i].selected) selection.push(options[i].value);
                  }
                    try{
                      if (key in features[0].properties){
                        for (i = features.length - 1;
                          i >= 0; --i){
                          if (selection.indexOf(
                          features[i].properties[key])<0
                          && selection.length>0) {
                          features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                  }
                }
                if (Filters[key] == "int"){
                  sliderVals =  document.getElementById(
                    "div_" + keyS).noUiSlider.get();
                  try{
                    if (key in features[0].properties){
                    for (i = features.length - 1; i >= 0; --i){
                      if (parseInt(features[i].properties[key])
                          < sliderVals[0]
                          || parseInt(features[i].properties[key])
                          > sliderVals[1]){
                            features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                    }
                  }
                if (Filters[key] == "real"){
                  sliderVals =  document.getElementById(
                    "div_" + keyS).noUiSlider.get();
                  try{
                    if (key in features[0].properties){
                    for (i = features.length - 1; i >= 0; --i){
                      if (features[i].properties[key]
                          < sliderVals[0]
                          || features[i].properties[key]
                          > sliderVals[1]){
                            features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                    }
                  }
                if (Filters[key] == "date"
                  || Filters[key] == "datetime"
                  || Filters[key] == "time"){
                  try{
                    if (key in features[0].properties){
                      HTMLkey = key.replace(/[&\\/\\#,+()$~%.'":*?<>{} ]/g, '');
                      startdate = document.getElementById("dat_" +
                        HTMLkey + "_date1").value.replace(" ", "T");
                      enddate = document.getElementById("dat_" +
                        HTMLkey + "_date2").value.replace(" ", "T");
                      for (i = features.length - 1; i >= 0; --i){
                        if (features[i].properties[key] < startdate
                          || features[i].properties[key] > enddate){
                          features.splice(i,1);
                        }
                      }
                    }
                  } catch(err){
                  }
                }
              }
            } catch(err){
            }
          this[lyr["options"]["layerName"]].clearLayers();
          this[lyr["options"]["layerName"]].addData(features);
          if (lyr["options"]["layerName"] === "layer_Pohybosob_4") {
              rebuildArrows_Pohybosob_4();
          }
        var i = 0;

                filterFunc()

            div_Jmna.appendChild(lab_Jmna);
            var reset_Jmna = document.createElement('div');
